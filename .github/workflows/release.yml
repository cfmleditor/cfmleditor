name: Release
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publishMS:
        description: 'Publish to the VS Marketplace'
        type: boolean
        required: true
        default: true
      publishOVSX:
        description: 'Publish to OpenVSX'
        type: boolean
        required: true
        default: true
      publishGH:
        description: 'Publish to GitHub Releases'
        type: boolean
        required: true
        default: true

jobs:
  meta:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.setup-tag.outputs.tag }}
      version: ${{ steps.setup-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup tag
        id: setup-tag
        run: |
          version=$(node -e "console.log(require('./package.json').version)")
          echo "tag=release/$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    # One package per platform, each carrying the language server for that
    # platform, so a first run needs no network and a blocked GitHub costs an
    # upgrade rather than every language feature. The universal package ships
    # no server and downloads one on demand — it is what installs on the
    # platforms the server is not built for, and on any editor that asks for a
    # target we do not publish.
    name: Package ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: win32-x64
            target: win32-x64
          - label: win32-arm64
            target: win32-arm64
          - label: linux-x64
            target: linux-x64
          - label: linux-arm64
            target: linux-arm64
          - label: darwin-x64
            target: darwin-x64
          - label: darwin-arm64
            target: darwin-arm64
          - label: universal
            target: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm i

      - name: Bundle the language server
        if: matrix.target != ''
        run: npm run bundle-server -- --target ${{ matrix.target }}

      - name: Setup package path
        id: setup
        run: |
          suffix=$([ -n "${{ matrix.target }}" ] && echo "-${{ matrix.target }}" || echo "")
          echo "packageName=cfmleditor-${{ needs.meta.outputs.version }}$suffix.vsix" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          target=$([ -n "${{ matrix.target }}" ] && echo "--target ${{ matrix.target }}" || echo "")
          npx vsce package $target --out ${{ steps.setup.outputs.packageName }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.packageName }}
          path: ./${{ steps.setup.outputs.packageName }}
          if-no-files-found: error

  publishMS:
    name: Publish to VS marketplace
    runs-on: ubuntu-latest
    needs: [meta, package]
    if: github.event.inputs.publishMS == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*.vsix'
          merge-multiple: true
      - name: Publish to VS marketplace
        # Every package goes up in one call: the marketplace serves each install
        # the one for its platform, and a release missing a platform leaves
        # those users on the previous version. `--skip-duplicate` makes a re-run
        # after a half-finished release pick up where it stopped rather than
        # failing on the packages that already went up.
        run: npx vsce publish --packagePath packages/*.vsix --skip-duplicate -p ${{ secrets.VSCE_PAT }}

  publishOVSX:
    name: Publish to OpenVSX
    runs-on: ubuntu-latest
    needs: [meta, package]
    if: github.event.inputs.publishOVSX == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*.vsix'
          merge-multiple: true
      - name: Publish to OpenVSX
        run: npx ovsx publish --packagePath packages/*.vsix --skip-duplicate -p ${{ secrets.OVSX_PAT }}

  publishGH:
    name: Publish to GitHub releases
    runs-on: ubuntu-latest
    needs: [meta, package]
    if: github.event.inputs.publishGH == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*.vsix'
          merge-multiple: true

      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          release_name: Release ${{ needs.meta.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload assets to a Release
        uses: AButler/upload-release-assets@v3.0
        with:
          files: 'packages/*.vsix'
          release-tag: ${{ needs.meta.outputs.tag }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
