name: Release
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publishMS:
        description: 'Publish to the VS Marketplace'
        type: boolean
        required: true
        default: false
      publishOVSX:
        description: 'Publish to OpenVSX (paused: off unless ticked)'
        type: boolean
        required: true
        default: false
      publishGH:
        description: 'Publish to GitHub Releases'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  meta:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.setup-tag.outputs.tag }}
      version: ${{ steps.setup-tag.outputs.version }}
      marketplaces: ${{ steps.gate.outputs.marketplaces }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup tag
        id: setup-tag
        run: |
          version=$(node -e "console.log(require('./package.json').version)")
          echo "tag=release/$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A published release publishes. `github.event.inputs` is empty on a
      # release event, so gating on the inputs alone meant publishing a release
      # built seven packages and then sent them nowhere.
      #
      # Decided here and passed on as an output because a job's `if` can read
      # `needs` but not `env`, where the same expression would have evaluated to
      # nothing at all and skipped every publish exactly as before.
      - name: Decide whether the marketplaces publish
        id: gate
        run: echo "marketplaces=${{ github.event_name == 'release' && github.event.release.prerelease == false }}" >> "$GITHUB_OUTPUT"

  package:
    # One package per platform, each carrying the language server for that
    # platform, so a first run needs no network and a blocked GitHub costs an
    # upgrade rather than every language feature. The universal package ships
    # no server and downloads one on demand — it is what installs on the
    # platforms the server is not built for, and on any editor that asks for a
    # target we do not publish.
    name: Package ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: win32-x64
            target: win32-x64
          - label: win32-arm64
            target: win32-arm64
          - label: linux-x64
            target: linux-x64
          - label: linux-arm64
            target: linux-arm64
          - label: darwin-x64
            target: darwin-x64
          - label: darwin-arm64
            target: darwin-arm64
          - label: universal
            target: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Bundle the language server
        if: matrix.target != ''
        run: npm run bundle-server -- --target ${{ matrix.target }}

      - name: Setup package path
        id: setup
        run: |
          suffix=$([ -n "${{ matrix.target }}" ] && echo "-${{ matrix.target }}" || echo "")
          echo "packageName=cfmleditor-${{ needs.meta.outputs.version }}$suffix.vsix" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          target=$([ -n "${{ matrix.target }}" ] && echo "--target ${{ matrix.target }}" || echo "")
          npx vsce package $target --out ${{ steps.setup.outputs.packageName }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.packageName }}
          path: ./${{ steps.setup.outputs.packageName }}
          if-no-files-found: error

  verify:
    name: Verify release packages
    runs-on: ubuntu-latest
    needs: [meta, package]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*.vsix'
          merge-multiple: true
      - name: Check all seven packages and record checksums
        working-directory: packages
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          packages=("cfmleditor-$VERSION.vsix" "cfmleditor-$VERSION-"{win32-x64,win32-arm64,linux-x64,linux-arm64,darwin-x64,darwin-arm64}.vsix)
          actual=(*.vsix)
          test "${#actual[@]}" -eq "${#packages[@]}"
          for package in "${packages[@]}"; do
            unzip -tq "$package"
          done
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: packages/SHA256SUMS.txt
          if-no-files-found: error

  publishMS:
    name: Publish to VS marketplace
    runs-on: ubuntu-latest
    needs: [meta, verify]
    # Pre-releases are packaged and attached to the GitHub release, but not sent
    # to the marketplaces: a pre-release published to the stable channel is not
    # something you can take back. Publishing those needs `--pre-release` and a
    # version scheme to match, which is a decision, not a default.
    if: needs.meta.outputs.marketplaces == 'true' || inputs.publishMS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*.vsix'
          merge-multiple: true
      - name: Publish to VS marketplace
        # Every package goes up in one call: the marketplace serves each install
        # the one for its platform, and a release missing a platform leaves
        # those users on the previous version. `--skip-duplicate` makes a re-run
        # after a half-finished release pick up where it stopped rather than
        # failing on the packages that already went up.
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          : "${VSCE_PAT:?Set the VSCE_PAT repository secret}"
          npx --no-install vsce publish --packagePath packages/*.vsix --skip-duplicate

  publishOVSX:
    name: Publish to OpenVSX
    runs-on: ubuntu-latest
    needs: verify
    # Open VSX is paused. A published release goes to the VS Marketplace only;
    # this still runs when a manual dispatch asks for it, so turning it back on
    # is ticking a box rather than restoring a job.
    if: inputs.publishOVSX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*.vsix'
          merge-multiple: true
      - name: Publish to OpenVSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          : "${OVSX_PAT:?Set the OVSX_PAT repository secret}"
          npx --no-install ovsx publish --packagePath packages/*.vsix --skip-duplicate

  publishGH:
    name: Publish to GitHub releases
    runs-on: ubuntu-latest
    needs: [meta, verify]
    permissions:
      contents: write
    # Every release gets the packages attached, pre-release or not.
    if: github.event_name == 'release' || inputs.publishGH
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*.vsix'
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
          path: packages

      - name: Upload assets to a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          cd packages
          sha256sum --check SHA256SUMS.txt
          if assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            existing=$(mktemp -d)
            missing=()
            for file in *.vsix SHA256SUMS.txt; do
              if grep -Fxq "$file" <<< "$assets"; then
                gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir "$existing"
                if ! cmp -s "$file" "$existing/$file"; then
                  echo "::error::Release $TAG already has different bytes for $file"
                  exit 1
                fi
              else
                missing+=("$file")
              fi
            done
            if (( ${#missing[@]} )); then
              gh release upload "$TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh release create "$TAG" *.vsix SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Release $VERSION" --generate-notes
          else
            exit 1
          fi
